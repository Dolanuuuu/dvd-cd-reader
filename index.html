<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VHS Capture</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14110f; --panel: #1f1a17; --line: #3a312b; --text: #f3e9dc;
    --muted: #a8998a; --accent: #ff5b2e; --rec: #ff2e4d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: "Space Grotesk", system-ui, sans-serif; }
  header { display: flex; align-items: baseline; gap: 16px; padding: 24px 32px 8px; }
  h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 14px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 24px; padding: 16px 32px 32px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 16px; } header { padding: 16px; } }
  .screen { position: relative; background: #000; border: 1px solid var(--line); border-radius: 6px;
            aspect-ratio: 4 / 3; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .screen img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .screen::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.12) 0 1px, transparent 1px 3px); }
  .osd { position: absolute; top: 14px; left: 16px; z-index: 1; font-family: "JetBrains Mono", monospace;
         font-size: 18px; text-shadow: 0 0 6px #000; display: flex; gap: 14px; }
  .osd .dot { color: var(--rec); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .controls { margin-top: 16px; display: flex; gap: 12px; flex-wrap: wrap; }
  input { flex: 1; min-width: 180px; background: var(--panel); border: 1px solid var(--line); color: var(--text);
          padding: 12px 14px; border-radius: 6px; font: inherit; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { font: 600 15px "Space Grotesk", sans-serif; border: 0; border-radius: 6px; padding: 12px 20px;
           cursor: pointer; transition: transform .1s, filter .15s; }
  button:hover { filter: brightness(1.12); } button:active { transform: scale(.97); }
  button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .rec { background: var(--rec); color: #fff; }
  .stop { background: var(--text); color: var(--bg); }
  .ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .hint { color: var(--muted); font-size: 13px; margin-top: 10px; line-height: 1.5; }
  .err { color: var(--rec); font-family: "JetBrains Mono", monospace; font-size: 12px; white-space: pre-wrap; }
  aside { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 18px; align-self: start; }
  aside h2 { margin: 0 0 12px; font-size: 15px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .file { padding: 12px 0; border-top: 1px solid var(--line); }
  .file:first-of-type { border-top: 0; }
  .file .name { font-weight: 600; word-break: break-all; }
  .file .meta { font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--muted); margin-top: 3px; }
  .file a { color: var(--accent); font-size: 13px; margin-right: 12px; }
  .file video { width: 100%; margin-top: 8px; border-radius: 4px; }
  .empty { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>VHS <span>Capture</span></h1>
  <div class="sub" id="sub">boîtier composite USB</div>
</header>
<main>
  <section>
    <div class="screen">
      <div class="osd"><span class="dot" id="dot" hidden>● REC</span><span id="osd">PLAY ▶</span></div>
      <img id="live" src="/stream" alt="Aperçu live du caméscope">
    </div>
    <div class="controls">
      <input id="name" placeholder="Nom du rush (optionnel)">
      <button class="rec" id="recBtn">● Enregistrer</button>
      <button class="stop" id="stopBtn" hidden>■ Arrêter</button>
      <button class="ghost" id="restartBtn" title="Relancer le flux si l'image est figée">↻ Relancer</button>
    </div>
    <div class="hint">Lance la lecture sur le caméscope, puis Enregistrer. L'aperçu se coupe une seconde au démarrage et à l'arrêt.
      Les fichiers sont dans <code>~/VHS-capture/rushs/</code>.</div>
    <div class="err" id="err"></div>
  </section>
  <aside>
    <h2>Rushs</h2>
    <div id="files"></div>
  </aside>
</main>
<script>
const $ = (id) => document.getElementById(id);
let openVideo = null;

const fmtTime = (s) => [s / 3600, (s % 3600) / 60, s % 60].map((v) => String(Math.floor(v)).padStart(2, "0")).join(":");
const fmtSize = (b) => b > 1e9 ? (b / 1e9).toFixed(2) + " Go" : (b / 1e6).toFixed(1) + " Mo";

function reloadStream() { $("live").src = "/stream?" + Date.now(); }

async function post(url) {
  const r = await fetch(url, { method: "POST" });
  setTimeout(reloadStream, 800);
  return r.json();
}

$("recBtn").onclick = () => post("/api/record/start?name=" + encodeURIComponent($("name").value));
$("stopBtn").onclick = () => post("/api/record/stop");
$("restartBtn").onclick = () => post("/api/restart");

function renderFiles(files) {
  const box = $("files");
  if (!files.length) {
    const e = document.createElement("div"); e.className = "empty"; e.textContent = "Aucun rush pour l'instant.";
    box.replaceChildren(e); return;
  }
  box.replaceChildren(...files.map((f) => {
    const el = document.createElement("div");
    el.className = "file";
    const url = "/files/" + encodeURIComponent(f.name);
    const name = document.createElement("div"); name.className = "name"; name.textContent = f.name;
    const meta = document.createElement("div"); meta.className = "meta";
    meta.textContent = fmtSize(f.size) + " · " + new Date(f.mtime * 1000).toLocaleString("fr-FR") + (f.recording ? " · en cours" : "");
    el.append(name, meta);
    if (!f.recording) {
      const play = document.createElement("a"); play.href = "#"; play.textContent = "Lire";
      play.onclick = (e) => { e.preventDefault(); openVideo = openVideo === f.name ? null : f.name; renderFiles(files); };
      const dl = document.createElement("a"); dl.href = url; dl.download = f.name; dl.textContent = "Télécharger";
      el.append(play, dl);
      if (openVideo === f.name) {
        const v = document.createElement("video"); v.src = url; v.controls = true; v.autoplay = true; el.append(v);
      }
    }
    return el;
  }));
}

let lastFiles = "";
async function poll() {
  try {
    const s = await (await fetch("/api/status")).json();
    const rec = !!s.recording;
    $("recBtn").hidden = rec; $("stopBtn").hidden = !rec; $("name").disabled = rec; $("restartBtn").hidden = rec;
    $("dot").hidden = !rec; $("sub").textContent = "boîtier composite USB · " + s.backend;
    $("osd").textContent = rec ? fmtTime(s.elapsed) : (s.live ? "PLAY ▶" : "— PAS DE FLUX —");
    $("err").textContent = s.error;
    const key = JSON.stringify(s.files.map((f) => [f.name, f.recording, Math.round(f.size / 1e6)]));
    if (key !== lastFiles) { lastFiles = key; renderFiles(s.files); }
  } catch (e) { $("err").textContent = "Serveur injoignable."; }
}
setInterval(poll, 1000); poll();
</script>
</body>
</html>
